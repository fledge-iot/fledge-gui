server_tokens off;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

index fledge.html index.html;

location ~* \.[a-z0-9]+$ {
    try_files $uri =404;
    expires 1h;
}

location = /fledge.html {
    expires -1;
}

location / {
    try_files $uri /fledge.html;
}
