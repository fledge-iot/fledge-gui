name: CI - Build and Lint

on:
  push:
    branches:
      - main
      - develop
      - 'FOGL-*'
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '16'

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install Dependencies
        run: |
          yarn install --frozen-lockfile
          ./requirements

      - name: Lint Code
        run: yarn lint
        continue-on-error: true

      - name: Build Application
        run: yarn build --configuration production

      - name: Check Build Size
        run: |
          echo "Build completed successfully!"
          du -sh dist/
          ls -lh dist/*.js | head -10

      - name: Upload Build Artifacts
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: dist/
          retention-days: 3

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Run Unit Tests
        run: yarn test --watch=false --code-coverage --browsers=ChromeHeadlessCI
        continue-on-error: false

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Check TypeScript
        run: npx tsc --project tsconfig.app.json --noEmit
        continue-on-error: true

      - name: Check Code Formatting
        run: |
          echo "Checking for common code quality issues..."
          # Add prettier or other formatting checks here if configured
          echo "Code quality checks completed"

  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    needs: [build, unit-tests, code-quality]
    if: always()

    steps:
      - name: Check Job Results
        run: |
          echo "=== CI Summary ==="
          echo "Build: ${{ needs.build.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo ""
          
          # Critical checks - must pass
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed - BLOCKING"
            exit 1
          fi
          
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Unit tests failed - BLOCKING"
            exit 1
          fi
          
          # Non-blocking checks - warnings only
          if [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "⚠️  Code quality checks failed - WARNING (non-blocking)"
            echo "    Please review linting and TypeScript errors"
          fi
          
          echo ""
          echo "✅ CI checks completed (critical checks passed)"

