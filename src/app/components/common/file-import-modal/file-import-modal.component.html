<div [id]="'file-import-modal-' + configuration.key" class="modal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title is-size-6">
        {{isManualMode ? 'Import Content' : 'Import File'}}
      </p>
      <button class="delete" aria-label="close" (click)="formReset()"></button>
    </header>

    <section class="modal-card-body py-2">
      <!-- Progress Bar -->
      <div *ngIf="isLoading" class="loading-container mb-4">
        <div class="progress-container">
          <progress class="progress is-small is-primary" max="100"></progress>
        </div>
        <p class="has-text-centered has-text-grey">Processing file...</p>
      </div>

      <!-- File Upload Mode -->
      <div *ngIf="!isManualMode" class="file has-name is-fullwidth is-small"
        [ngClass]="{'error': !file.isValidExtension || !file.isValid}" (dragover)="onDragOver($event)"
        (drop)="onDropSuccess($event)">
        <label class="file-label">
          <input #fileImport class="file-input p-5" type="file" (click)="$event.target.value=null;"
            (change)="onFileChange($event)">
          <span class="file-cta p-5">
            <span class="file-icon">
              <i class="bi bi-upload"></i>
            </span>
            <span class="file-label">
              Drag and Drop a File or Browse
            </span>
          </span>
          <span class="file-name p-5 is-flex">
            <span>{{file.name}}</span>
          </span>
        </label>
      </div>

      <!-- Manual Paste Mode -->
      <div *ngIf="isManualMode" class="manual-paste-container">
        <!-- Delimiter Dropdown -->
        <div class="is-flex is-align-items-center is-justify-content-flex-end mb-2" *ngIf="detectedFormat === 'CSV'">
          <label class="label is-small mb-0 mr-2">CSV Delimiter</label>
          <div class="select is-small">
            <select aria-label="Delimiter" [ngModel]="selectedDelimiter" (ngModelChange)="onDelimiterChange($event)">
              <option *ngFor="let option of delimiterOptions" [ngValue]="option.value">
                {{option.label}}
              </option>
            </select>
          </div>
        </div>

        <!-- CodeMirror Editor -->
        <div class="field">
          <div class="control">
            <ngx-codemirror name="manualContent" [(ngModel)]="manualContent" [options]="codeMirrorOptions"
              (ngModelChange)="onManualContentChange($event)" placeholder="Paste CSV or JSON content here...">
            </ngx-codemirror>
          </div>

          <!-- Format Info -->
          <p class="help" *ngIf="detectedFormat && !validationError">
            <i class="bi bi-info-circle"></i>
            Detected format: <strong>{{detectedFormat}}</strong>
            <span *ngIf="detectedFormat === 'CSV'"> with {{getDelimiterDisplayName()}} delimiter</span>
          </p>
        </div>
      </div>

      <!-- Invalid File Messages -->
      <template [ngTemplateOutlet]="invalidFileTemplate"></template>

      <!-- Preview Table -->
      <table class="table is-responsive mt-2" *ngIf="tableData">
        <thead>
          <tr>
            <th *ngFor="let prop of tableData[0].split(selectedDelimiter)">
              {{prop}}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of tableData; let i = index;">
            <ng-container *ngIf="i > 0">
              <td *ngFor="let val of row.split(selectedDelimiter)">
                {{val}}
              </td>
            </ng-container>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Footer -->
    <footer class="modal-card-foot">
      <div class="buttons">
        <button class="button is-small is-link is-outlined" (click)="appendFileData()"
          [disabled]="!file.isLoaded">Append</button>
        <button class="button is-small is-link is-outlined" (click)="overrideFileData()"
          [disabled]="!file.isLoaded">Override</button>
      </div>
      <div class="buttons">
        <button class="button is-small is-ghost" (click)="toggleManualMode()">
          <span class="icon">
            <i class="bi" [ngClass]="isManualMode ? 'bi-upload' : 'bi-copy'"></i>
          </span>
          <span>{{isManualMode ? 'Upload File' : 'Paste Content'}}</span>
        </button>
      </div>
    </footer>
  </div>
</div>

<!-- Invalid File Template -->
<ng-template #invalidFileTemplate>
  <span *ngIf="!file.isValidExtension" class="invalid has-text-danger mt-1">
    Only CSV or JSON file is allowed
  </span>
  <span *ngIf="!file.isValid" class="invalid has-text-danger mt-1">
    {{validationError}}
  </span>
</ng-template>
