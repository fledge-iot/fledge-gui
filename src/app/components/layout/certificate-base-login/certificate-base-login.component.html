<div id="certificate-login-modal" class="modal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head" style="flex-grow:0;">
      <p class="modal-card-title is-size-6">Login with Certificate</p>
      <button class="delete" aria-label="close" (click)="toggleModal(false)"></button>
    </header>
    <section class="modal-card-body">
      <form [formGroup]="form" id="ngForm" (ngSubmit)="LoginWithCertificate()" novalidate>
        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-size-9">{{ showBrowseCertificate ? 'Certificate' : 'Certificate Content' }}</label>
              <div class="certificate-input-container">
                <div *ngIf="showBrowseCertificate" class="file is-fullwidth">
                  <label class="file-label">
                    <span class="file-cta is-fullwidth">
                      <span class="file-icon">
                        <i class="bi bi-sm bi-upload"></i>
                      </span>
                      <input type="file" required id="certificate" (change)="onCertificateChange($event)"
                        formControlName="certificate" #fileInput>
                      <small *ngIf="!isCertificateExt" class="help is-danger level-left">Not a 'certificate'
                        file.</small>
                    </span>
                  </label>
                </div>
                <textarea *ngIf="!showBrowseCertificate" class="textarea" cols="30"
                  style="height: 120px; resize: vertical;" formControlName="certificateText">
                </textarea>
              </div>
            </div>
          </div>
        </div>
      </form>
    </section>
    <footer class="modal-card-foot is-flex is-justify-content-space-between is-align-items-flex-start">
      <div class="buttons mb-0">
        <button class="button is-small" (click)="toggleModal(false)">Cancel</button>
        <button id="save" type="submit" form="ngForm" class="button is-link is-small">Log In</button>
      </div>
      <button class="button is-small is-text"
        (click)="selectOptionOfCertificateLogin()">{{loginCertButtonText}}</button>
    </footer>
  </div>
</div>
