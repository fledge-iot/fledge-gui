<div class="modal is-lightweight" id="debugger-readings-box" cdkDrag>
  <div class="modal-card buffer-reading-card">
    <header class="modal-card-head p-2">
      <span class="modal-card-title is-size-6">
        <small> {{debuggerData?.node}} Buffer Data </small>
      </span>
      <button class="delete is-small" aria-label="close" (click)="toggleModal(false)"></button>
    </header>
    <section class="modal-card-body m-0 p-0">
      <app-debugger *ngIf="debuggerData?.debug" [debuggerData]="debuggerData" from="debugger-readings"
        [serviceName]="debuggerData.serviceName"></app-debugger>
    </section>
  </div>
</div>
