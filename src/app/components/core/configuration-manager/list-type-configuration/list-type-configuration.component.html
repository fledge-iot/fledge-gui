<ng-container *ngIf="configuration.items == 'object' && listItems.controls.length>0">
  <div class="is-flex toggle-btn-container">
    <app-toggle-switch (currentView)="setCurrentView($event)" [isListView]="isListView" />
  </div>
</ng-container>

<div [formGroup]="listItemsForm" class="items-container">
  <ng-container *ngIf="configuration.items == 'object' && listItems.controls.length>0">
    <div *ngIf="!isListView" class="btn-panel-container is-flex-direction-row-reverse">
      <div class="btn-panel upper-btn-panel">
        <app-button-panel [isFormValid]="listItems.valid && validConfigurationForm" [isListView]="isListView"
          (addnewItem)="addListItem(true)" (expandAll)="expandAllItems()" (collapseAll)="collapseAllItems()"
          (importFile)="openModal()" (exportFile)="openExportFileModal()"
          [isAddButtonVisible]="rolesService.hasAccessPermission(configuration?.permissions) && (!configuration.listSize || configuration.listSize != listItems.controls.length)" />
      </div>
    </div>
  </ng-container>

  <div *ngIf="!listItems.length" class="has-text-centered p-5">
    <p>No items to display</p>
    <div class="field is-grouped is-grouped-centered mt-4">
      <!-- Add first item button -->
      <div class="control">
        <button class="button is-small" (click)="addListItem(false)"
          *ngIf="rolesService.hasAccessPermission(configuration?.permissions)">
          Add first item
        </button>
      </div>

      <!-- Import button -->
      <div class="control">
        <button class="button is-small" (click)="openModal()"
          *ngIf="rolesService.hasAccessPermission(configuration?.permissions)">
          Import
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="listItems.length > 0">
    <ng-container *ngIf="configuration.items !== 'object'; else objectTemplate">
      <form [formGroup]="listItemsForm">
        <div formArrayName="listItems">
          <!-- Simple rendering for debugging - show all items -->
          <div *ngFor="let ctrl of listItems.controls; let i = index; trackBy: trackByIndex" class="list-item mb-3">
            <div class="field">
              <div class="columns is-flex is-vcentered">
                <div class="column is-11">
                  <ng-container *ngIf="rolesService.hasAccessPermission(configuration?.permissions); else staticView">
                    <input *ngIf="configuration.items === 'integer'" class="input is-small" type="text"
                      [formControlName]="i" [minValue]="configuration?.minimum" [maxValue]="configuration?.maximum"
                      autocomplete="off" appIntegerOnly />
                    <input *ngIf="configuration.items === 'float'" class="input is-small" type="text"
                      [formControlName]="i" [minValue]="configuration?.minimum" [maxValue]="configuration?.maximum"
                      autocomplete="off" appFloatOnly />
                    <input *ngIf="configuration.items === 'string'" class="input is-small" type="text"
                      [formControlName]="i" [attr.maxLength]="configuration?.length" />
                  </ng-container>
                  <ng-template #staticView>
                    <span class="help">{{ ctrl.value }}</span>
                  </ng-template>
                </div>
                <div class="column is-1" *ngIf="rolesService.hasAccessPermission(configuration?.permissions)">
                  <button class="delete my-1 is-small" (click)="removeListItem(i)"></button>
                </div>
              </div>
              <span *ngIf="ctrl.hasError && ctrl.hasError('minValue')" class="help is-danger">
                <sup>*</sup>Value should not be less than {{ configuration?.minimum }}.
              </span>
              <span *ngIf="ctrl.hasError && ctrl.hasError('maxValue')" class="help is-danger">
                <sup>*</sup>Value should not be greater than {{ configuration?.maximum }}.
              </span>
            </div>
          </div>
        </div>
      </form>
    </ng-container>

    <ng-template #objectTemplate>
      <ng-container *ngIf="!isListView">
        <div class="scrollable">
          <app-list-card *ngFor="let ctrl of listItems.controls; let i = index; trackBy: trackByIndex"
            [configuration]="configuration" [listItemsForm]="listItemsForm" [initialProperties]="initialProperties"
            [from]="from" [group]="group" [listLabel]="listLabel" [firstKey]="firstKey" [items]="items" [item]="ctrl"
            [index]="i" (changedConfiguration)="getChangedConfiguration(i, $event)" (formState)="formStatus($event, i)"
            (removeItem)="removeListItem(i)">
          </app-list-card>
        </div>
      </ng-container>

      <ng-container *ngIf="isListView">
        <div class="btn-panel-container is-flex-direction-row-reverse">
          <div class="btn-panel upper-btn-panel">
            <app-button-panel [isFormValid]="listItems.valid && validConfigurationForm" [isListView]="isListView"
              (addnewItem)="addListItem(true)" (expandAll)="expandAllItems()" (collapseAll)="collapseAllItems()"
              (importFile)="openModal()" (exportFile)="openExportFileModal()"
              [isAddButtonVisible]="rolesService.hasAccessPermission(configuration?.permissions) && (!configuration.listSize || configuration.listSize != listItems.controls.length)" />
          </div>
        </div>

        <app-list-table [configuration]="configuration" [listItemsForm]="listItemsForm"
          [initialProperties]="initialProperties" [from]="from" [group]="group" [listLabel]="listLabel"
          [firstKey]="firstKey" [items]="items" [listType]="'list'" [validConfigurationForm]="validConfigurationForm"
          (changedConfiguration)="getChangedConfiguration($event.index, $event.data)"
          (formState)="formStatus($event, $event.index)" (removeItem)="removeListItem($event)"
          (addItem)="addListItem($event)" (openModalEvent)="openModal()" (exportFile)="openExportFileModal()">
        </app-list-table>
      </ng-container>
    </ng-template>
  </div>

  <!-- Add button panel at bottom for simple items -->
  <ng-container *ngIf="configuration.items !== 'object'">
    <div class="btn-panel-container is-flex-direction-row-reverse mt-3">
      <div class="btn-panel">
        <app-button-panel [isFormValid]="listItems.valid" [isListView]="true" (addnewItem)="addListItem(false)"
          (importFile)="openModal()" (exportFile)="openExportFileModal()"
          [isAddButtonVisible]="rolesService.hasAccessPermission(configuration?.permissions)" />
      </div>
    </div>
  </ng-container>
</div>

<!-- Import/Export Modals -->
<app-file-import-modal #fileImportModal [configuration]="configuration" (appendFile)="onAppendFile($event)"
  (overrideFile)="onOverrideFile($event)">
</app-file-import-modal>

<app-file-export-modal #fileExportModal [configuration]="configuration" [data]="exportData"
  [categoryName]="categoryName">
</app-file-export-modal>
