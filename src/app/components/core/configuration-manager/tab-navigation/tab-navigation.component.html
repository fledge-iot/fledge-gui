<div class="buttons m-0 is-flex is-justify-content-space-between is-align-items-center">
  <div>
    <button *ngIf="activeTab != 0" class="tab-navigation button is-small is-ghost p-0 mx-0 my-2 pr-1"
      (click)="prevTab()">
      <span><i class="bi bi-chevron-left"></i> Previous{{activeTab === 0 ?'': ':' }} {{ tabs[activeTab -
        1]?.name}}</span>
    </button>
    <button *ngIf="!isLastTab()" class="tab-navigation button is-small is-ghost p-0 mx-0 my-2 pl-1" (click)="nextTab()">
      <span>Next: {{tabs[activeTab + 1]?.name}} <i class="bi bi-chevron-right"></i></span>
    </button>
  </div>
  <div *ngIf="showValidate">
    <button class="button is-small is-light" type="button" (click)="onValidateClick()"
      [ngClass]="{'m-1': from == 'add-service-form' || from == 'add-task-form'}"
      title="Validate current configuration">Validate</button>
  </div>
</div>
