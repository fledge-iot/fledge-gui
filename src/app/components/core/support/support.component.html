<div class="container is-fluid">
  <div class="card">
    <header class="card-header">
      <p class="card-header-title">
        Support Bundles &nbsp;
        <button (click)="getBundles()" title="Reload" class="button is-small" id="refresh-check">
          <i class="bi bi-lg bi-arrow-repeat" aria-hidden="true"></i>
        </button>
      </p>
      <div *ngIf="rolesService.hasEditPermissions()">
        <a class="button is-small mt-2 is-light" (click)="requestNewBundle()">
          <p *ngIf="viewPort !== 'mobile'" class="add-btn">Request New &nbsp;</p>
          <i class="bi bi-file-medical bi-sm" aria-hidden="true"></i>
        </a>
        <span class="icon is-small tooltip has-tooltip-left has-tooltip-arrow is-hovered help-pad is-size-9"
          data-tooltip="Help" (click)="goToLink()">
          <i class="bi bi-question-circle"></i>
        </span>
      </div>
    </header>
    <div class="card-content">
      <table class="table is-narrow scroll is-responsive is-hoverable" cellpadding="0" cellspacing="0">
        <tbody>
          <tr *ngFor="let bundle of bundlesData" class="support-bundles-row">
            <td style="vertical-align: middle;">{{ bundle }}</td>
            <td>
              <div class="action-wrapper">
                <a (click)="downloadBundle(bundle)" class="button is-text text-btn">
                  download
                </a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
